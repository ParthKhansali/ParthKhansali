  <text x="345" y="155" fill="#7dff9a" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="15" letter-spacing="3">CSE • SYSTEMS BUILDER • NATIVE &amp; FULL-STACK</text>

  <text x="345" y="222" fill="#39ff6a" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="54" font-weight="700" filter="url(#glow)">&gt; PARTH KHANSALI</text>

