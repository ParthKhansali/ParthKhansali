<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061008"/>
      <stop offset="1" stop-color="#020503"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#14351b" stroke-width="1"/>
    </pattern>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <clipPath id="frameClip">
      <rect x="18" y="18" width="1364" height="724" rx="20"/>
    </clipPath>
  </defs>

  <rect width="1400" height="760" fill="url(#bg)"/>
  <rect width="1400" height="760" fill="url(#grid)" opacity=".8"/>

  <!-- Matrix rain -->
  <g clip-path="url(#frameClip)" fill="#39ff6a" font-family="monospace" font-size="16" opacity=".13">
    <g>
      <text x="55" y="-30">1010011011</text>
      <text x="55" y="10">0101100101</text>
      <text x="55" y="50">1100101011</text>
      <text x="55" y="90">0011010110</text>
      <animateTransform attributeName="transform" type="translate" from="0,-120" to="0,820" dur="8s" repeatCount="indefinite"/>
    </g>
    <g>
      <text x="180" y="-80">0110100101</text>
      <text x="180" y="-40">1011010010</text>
      <text x="180" y="0">0010111010</text>
      <text x="180" y="40">1100100110</text>
      <animateTransform attributeName="transform" type="translate" from="0,-250" to="0,900" dur="11s" repeatCount="indefinite"/>
    </g>
    <g>
      <text x="1180" y="-70">1001101010</text>
      <text x="1180" y="-30">0110010101</text>
      <text x="1180" y="10">1101011001</text>
      <text x="1180" y="50">0100101110</text>
      <animateTransform attributeName="transform" type="translate" from="0,-300" to="0,900" dur="9s" repeatCount="indefinite"/>
    </g>
    <g>
      <text x="1300" y="-90">0011010110</text>
      <text x="1300" y="-50">1010100101</text>
      <text x="1300" y="-10">0110110100</text>
      <text x="1300" y="30">1101011010</text>
      <animateTransform attributeName="transform" type="translate" from="0,-400" to="0,900" dur="12s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Frame -->
  <rect x="18" y="18" width="1364" height="724" rx="20" fill="none" stroke="#39ff6a" stroke-width="2"/>
  <rect x="30" y="30" width="1340" height="700" rx="15" fill="none" stroke="#39ff6a" stroke-width="1" opacity=".3"/>

  <!-- Top bar -->
  <circle cx="55" cy="54" r="5" fill="#39ff6a" filter="url(#glow)">
    <animate attributeName="opacity" values="1;.35;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="72" y="60" fill="#7dff9a" font-family="monospace" font-size="15">SYSTEM ONLINE</text>
  <text x="1190" y="60" fill="#6dbd7c" font-family="monospace" font-size="13">PARTH.DEV // 2026</text>

  <!-- Left HUD reticle -->
  <g transform="translate(160 245)">
    <circle r="122" fill="none" stroke="#39ff6a" stroke-width="1.5" opacity=".7"/>
    <circle r="92" fill="none" stroke="#39ff6a" stroke-width="1" opacity=".4"/>
    <circle r="47" fill="none" stroke="#39ff6a" stroke-width="1" opacity=".3"/>
    <path d="M-145 0H145M0-145V145" stroke="#39ff6a" stroke-width="1" opacity=".25"/>
    <circle r="7" fill="#39ff6a" filter="url(#glow)">
      <animate attributeName="r" values="5;9;5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <g stroke="#39ff6a" stroke-width="4">
      <path d="M-137-22V-137H-22"/>
      <path d="M22-137H137V-22"/>
      <path d="M137 22V137H22"/>
      <path d="M-22 137H-137V22"/>
    </g>
    <g transform="rotate(0)">
      <circle r="114" fill="none" stroke="#39ff6a" stroke-width="2" stroke-dasharray="6 18" opacity=".8"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Main identity -->
  <text x="345" y="165" fill="#7dff9a" font-family="monospace" font-size="18" letter-spacing="5">CSE • SOFTWARE BUILDER • AI / SYSTEMS</text>

  <text x="345" y="235" fill="#39ff6a" font-family="monospace" font-size="58" font-weight="700" filter="url(#glow)">
    &gt; PARTH KHANSALI
  </text>

  <text x="349" y="282" fill="#d9ffe2" font-family="monospace" font-size="20">
    Building AI-first products, full-stack systems &amp; useful software.
  </text>

  <text x="349" y="325" fill="#70c882" font-family="monospace" font-size="15">
    3rd-year B.Tech CSE • Graphic Era Hill University • Class of 2028
  </text>

  <!-- animated cursor -->
  <rect x="350" y="347" width="10" height="20" fill="#39ff6a">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Status panel -->
  <rect x="1020" y="115" width="285" height="180" rx="12" fill="#061109" stroke="#39ff6a"/>
  <text x="1042" y="150" fill="#39ff6a" font-family="monospace" font-size="15">&gt; STATUS</text>
  <text x="1042" y="181" fill="#d9ffe2" font-family="monospace" font-size="14">ROLE      CSE / BUILDER</text>
  <text x="1042" y="208" fill="#d9ffe2" font-family="monospace" font-size="14">FOCUS     AI + FULL-STACK</text>
  <text x="1042" y="235" fill="#d9ffe2" font-family="monospace" font-size="14">SYSTEMS   EXPLORING</text>
  <text x="1042" y="262" fill="#d9ffe2" font-family="monospace" font-size="14">STATE     BUILDING</text>

  <!-- Scan beam -->
  <rect x="40" y="90" width="1320" height="2" fill="#39ff6a" opacity=".35" filter="url(#softGlow)">
    <animate attributeName="y" values="90;690;90" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Divider -->
  <line x1="60" y1="400" x2="1340" y2="400" stroke="#39ff6a" opacity=".35"/>

  <!-- Project cards -->
  <g font-family="monospace">
    <rect x="60" y="430" width="395" height="185" rx="12" fill="#061109" stroke="#39ff6a"/>
    <text x="84" y="464" fill="#39ff6a" font-size="17">&gt; BUILD_01</text>
    <text x="84" y="498" fill="#d9ffe2" font-size="20" font-weight="700">OmniMentor</text>
    <text x="84" y="524" fill="#7dff9a" font-size="14">Anticipatory AI Classroom OS</text>
    <text x="84" y="553" fill="#c4eaca" font-size="13">Predicts learner needs • contextual</text>
    <text x="84" y="574" fill="#c4eaca" font-size="13">explanations • adaptive learning</text>
    <text x="84" y="599" fill="#39ff6a" font-size="11">NEXT.JS / REACT / NODE / PYTHON / AI</text>

    <rect x="480" y="430" width="395" height="185" rx="12" fill="#061109" stroke="#39ff6a"/>
    <text x="504" y="464" fill="#39ff6a" font-size="17">&gt; BUILD_02</text>
    <text x="504" y="498" fill="#d9ffe2" font-size="20" font-weight="700">GEHU Connect</text>
    <text x="504" y="524" fill="#7dff9a" font-size="14">University community platform</text>
    <text x="504" y="553" fill="#c4eaca" font-size="13">Student networking • mobile-first</text>
    <text x="504" y="574" fill="#c4eaca" font-size="13">campus communication &amp; collaboration</text>
    <text x="504" y="599" fill="#39ff6a" font-size="11">REACT NATIVE / SPRING BOOT / JWT / R2</text>

    <rect x="900" y="430" width="395" height="185" rx="12" fill="#061109" stroke="#39ff6a"/>
    <text x="924" y="464" fill="#39ff6a" font-size="17">&gt; BUILD_03</text>
    <text x="924" y="498" fill="#d9ffe2" font-size="20" font-weight="700">TaskFlow</text>
    <text x="924" y="524" fill="#7dff9a" font-size="14">Smart project management</text>
    <text x="924" y="553" fill="#c4eaca" font-size="13">Projects • tasks • workflows</text>
    <text x="924" y="574" fill="#c4eaca" font-size="13">built for productive collaboration</text>
    <text x="924" y="599" fill="#39ff6a" font-size="11">REACT / NODE / EXPRESS / MONGODB</text>
  </g>

  <!-- Bottom focus -->
  <text x="62" y="657" fill="#39ff6a" font-family="monospace" font-size="15">&gt; ENGINEERING_FOCUS</text>
  <text x="62" y="690" fill="#d9ffe2" font-family="monospace" font-size="14">AI SYSTEMS   •   FULL-STACK   •   OPERATING SYSTEMS   •   CLOUD   •   DATA</text>

  <text x="62" y="720" fill="#68b878" font-family="monospace" font-size="12">BUILD → LEARN → SHIP</text>
  <text x="1180" y="720" fill="#39ff6a" font-family="monospace" font-size="12">[ ONLINE ]</text>
</svg>