  <text x="585" y="59" fill="#4d9b5c" font-family="ui-monospace, 'SF Mono', 'Fira Code', Menlo, monospace" font-size="12" letter-spacing="2">FREQ_MOD: 44.1kHz</text>

  <text x="1345" y="59" fill="#7dff9a" font-family="ui-monospace, 'SF Mono', 'Fira Code', Menlo, monospace" font-size="13" text-anchor="end">PARTH.DEV // INDIA</text>

