  <text x="928" y="390" fill="#39ff6a" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11">+</text>
  <text x="1350" y="390" fill="#39ff6a" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11">+</text>

