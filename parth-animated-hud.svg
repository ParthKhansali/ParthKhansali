<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061008"/>
      <stop offset="100%" stop-color="#020503"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#14351b" stroke-width="1"/>
    </pattern>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <clipPath id="frameClip">
      <rect x="18" y="18" width="1364" height="744" rx="20"/>
    </clipPath>
  </defs>

  <!-- Background and grid -->
  <rect width="1400" height="780" fill="url(#bg)"/>
  <rect width="1400" height="780" fill="url(#grid)" opacity=".8"/>

  <!-- Matrix rain streams -->
  <g clip-path="url(#frameClip)" fill="#39ff6a" font-family="ui-monospace, 'SF Mono', 'Fira Code', Menlo, monospace" font-size="16" opacity=".14">
    <g>
      <text x="55" y="-30">1010011011</text>
      <text x="55" y="10">0101100101</text>
      <text x="55" y="50">1100101011</text>
      <text x="55" y="90">0011010110</text>
      <animateTransform attributeName="transform" type="translate" from="0,-120" to="0,840" dur="8s" repeatCount="indefinite"/>
    </g>
    <g>
      <text x="180" y="-80">0110100101</text>
      <text x="180" y="-40">1011010010</text>
      <text x="180" y="0">0010111010</text>
      <text x="180" y="40">1100100110</text>
      <animateTransform attributeName="transform" type="translate" from="0,-250" to="0,920" dur="11s" repeatCount="indefinite"/>
    </g>
    <g>
      <text x="1180" y="-70">1001101010</text>
      <text x="1180" y="-30">0110010101</text>
      <text x="1180" y="10">1101011001</text>
      <text x="1180" y="50">0100101110</text>
      <animateTransform attributeName="transform" type="translate" from="0,-300" to="0,920" dur="9s" repeatCount="indefinite"/>
    </g>
    <g>
      <text x="1300" y="-90">0011010110</text>
      <text x="1300" y="-50">1010100101</text>
      <text x="1300" y="-10">0110110100</text>
      <text x="1300" y="30">1101011010</text>
      <animateTransform attributeName="transform" type="translate" from="0,-400" to="0,920" dur="12s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Frame border with double line -->
  <rect x="18" y="18" width="1364" height="744" rx="20" fill="none" stroke="#39ff6a" stroke-width="2"/>
  <rect x="30" y="30" width="1340" height="720" rx="15" fill="none" stroke="#39ff6a" stroke-width="1" opacity=".3"/>

  <!-- Corner tactical brackets -->
  <g stroke="#39ff6a" stroke-width="3" fill="none">
    <path d="M 26 50 L 26 26 L 50 26"/>
    <path d="M 1374 50 L 1374 26 L 1350 26"/>
    <path d="M 26 730 L 26 754 L 50 754"/>
    <path d="M 1374 730 L 1374 754 L 1350 754"/>
  </g>

  <!-- Top telemetry header -->
  <circle cx="55" cy="54" r="5" fill="#39ff6a" filter="url(#glow)">
    <animate attributeName="opacity" values="1;.35;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="72" y="59" fill="#7dff9a" font-family="ui-monospace, 'SF Mono', 'Fira Code', Menlo, monospace" font-size="14" font-weight="600">SYSTEM ONLINE // KERNEL 26.0</text>
  
  <!-- Audio spectrum equalizer in header -->
  <g transform="translate(540, 50)" fill="#39ff6a">
    <rect x="0" y="0" width="3" height="12"><animate attributeName="height" values="3;14;5;12;3" dur="0.7s" repeatCount="indefinite"/></rect>
    <rect x="6" y="0" width="3" height="12"><animate attributeName="height" values="9;4;14;6;9" dur="0.6s" repeatCount="indefinite"/></rect>
    <rect x="12" y="0" width="3" height="12"><animate attributeName="height" values="5;14;3;10;5" dur="0.8s" repeatCount="indefinite"/></rect>
    <rect x="18" y="0" width="3" height="12"><animate attributeName="height" values="12;5;14;4;12" dur="0.65s" repeatCount="indefinite"/></rect>
    <rect x="24" y="0" width="3" height="12"><animate attributeName="height" values="7;12;4;14;7" dur="0.75s" repeatCount="indefinite"/></rect>
    <rect x="30" y="0" width="3" height="12"><animate attributeName="height" values="14;4;10;6;14" dur="0.55s" repeatCount="indefinite"/></rect>
