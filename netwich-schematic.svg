<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08140a"/>
      <stop offset="100%" stop-color="#020603"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Frame -->
  <rect x="2" y="2" width="916" height="356" rx="14" fill="url(#cardBg)" stroke="#39ff6a" stroke-width="1.5"/>

  <!-- Header bar -->
  <path d="M 2 16 Q 2 2 16 2 L 904 2 Q 918 2 918 16 L 918 40 L 2 40 Z" fill="#0d2212"/>
  <line x1="2" y1="40" x2="918" y2="40" stroke="#14351b" stroke-width="1"/>

  <circle cx="24" cy="21" r="5" fill="#39ff6a" filter="url(#glow)">
    <animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="42" y="26" fill="#7dff9a" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" font-weight="700">NETWICH // ARCHITECTURAL DATAFLOW SCHEMATIC</text>
  <text x="895" y="26" fill="#39ff6a" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" text-anchor="end">SWIFT 6 · DARWIN NETWORKING</text>

  <!-- Box 1: Outbound Traffic -->
  <g transform="translate(35, 75)" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <rect width="170" height="195" rx="10" fill="#061109" stroke="#39ff6a" stroke-width="1.2"/>
    <rect width="170" height="28" rx="10" fill="#14351b"/>
    <text x="85" y="19" fill="#d9ffe2" font-size="12" font-weight="700" text-anchor="middle">APPS / TRAFFIC</text>
    
    <text x="16" y="58" fill="#7dff9a" font-size="11">Source Demands:</text>
    <text x="16" y="82" fill="#d9ffe2" font-size="11">• Browser / HTTP</text>
    <text x="16" y="104" fill="#d9ffe2" font-size="11">• File Downloads</text>
    <text x="16" y="126" fill="#d9ffe2" font-size="11">• TCP Streams</text>
    
    <rect x="15" y="145" width="140" height="35" rx="6" fill="#08180c" stroke="#14351b"/>
    <text x="85" y="167" fill="#70c882" font-size="10" text-anchor="middle">Byte-Range Requests</text>
  </g>

  <!-- Connecting Bus 1 to 2 -->
  <line x1="205" y1="172" x2="265" y2="172" stroke="#39ff6a" stroke-width="2" stroke-dasharray="4 4"/>
  <!-- Data pulse -->
  <circle cx="205" cy="172" r="4" fill="#39ff6a" filter="url(#glow)">
    <animate attributeName="cx" from="205" to="265" dur="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Box 2: Netwich Core Engine -->
  <g transform="translate(265, 60)" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <rect width="360" height="225" rx="10" fill="#061109" stroke="#39ff6a" stroke-width="1.5"/>
    <rect width="360" height="32" rx="10" fill="#14351b"/>
    <text x="180" y="21" fill="#39ff6a" font-size="13" font-weight="700" text-anchor="middle" filter="url(#glow)">NETWICH DISPATCH CORE</text>

    <!-- Submodule 1 -->
    <rect x="20" y="48" width="320" height="36" rx="6" fill="#091c0e" stroke="#14351b"/>
    <text x="32" y="71" fill="#d9ffe2" font-size="11">Interface Discovery &amp; Health Probe</text>

    <!-- Submodule 2 -->
    <rect x="20" y="92" width="320" height="36" rx="6" fill="#091c0e" stroke="#14351b"/>
    <text x="32" y="115" fill="#d9ffe2" font-size="11">Scoped Route Binding (Darwin Kernel)</text>

    <!-- Submodule 3 -->
    <rect x="20" y="136" width="320" height="36" rx="6" fill="#091c0e" stroke="#14351b"/>
    <text x="32" y="159" fill="#d9ffe2" font-size="11">Parallel Byte-Range Stream Schedulers</text>

    <!-- Submodule 4 -->
    <rect x="20" y="180" width="320" height="32" rx="6" fill="#0d2e16" stroke="#39ff6a" stroke-width="1"/>
    <text x="180" y="201" fill="#39ff6a" font-size="11" font-weight="600" text-anchor="middle">SOCKS5 Proxy &amp; Native SwiftUI Frontend</text>
  </g>

  <!-- Splitting Bus lines from Engine to Interfaces -->
  <path d="M 625 130 L 675 115" fill="none" stroke="#39ff6a" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="625" cy="130" r="4" fill="#39ff6a" filter="url(#glow)">
    <animate attributeName="cx" values="625;675" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="130;115" dur="1s" repeatCount="indefinite"/>
  </circle>

  <path d="M 625 210 L 675 225" fill="none" stroke="#39ff6a" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="625" cy="210" r="4" fill="#39ff6a" filter="url(#glow)">
    <animate attributeName="cx" values="625;675" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="210;225" dur="1s" repeatCount="indefinite"/>
  </circle>

  <!-- Box 3A: Interface A -->
  <g transform="translate(675, 75)" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <rect width="205" height="85" rx="8" fill="#061109" stroke="#39ff6a" stroke-width="1.2"/>
    <text x="15" y="24" fill="#39ff6a" font-size="12" font-weight="700">INTERFACE A: en0</text>
    <text x="15" y="44" fill="#d9ffe2" font-size="11">Primary Wi-Fi Route</text>
    <text x="15" y="66" fill="#70c882" font-size="10">Streams 1-4 (Chunks: 0-50%)</text>
  </g>

  <!-- Box 3B: Interface B -->
  <g transform="translate(675, 185)" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <rect width="205" height="85" rx="8" fill="#061109" stroke="#39ff6a" stroke-width="1.2"/>
    <text x="15" y="24" fill="#39ff6a" font-size="12" font-weight="700">INTERFACE B: en4</text>
    <text x="15" y="44" fill="#d9ffe2" font-size="11">USB Phone Tethering</text>
    <text x="15" y="66" fill="#70c882" font-size="10">Streams 5-8 (Chunks: 50-100%)</text>
  </g>

  <!-- Footer telemetry bar -->
  <line x1="20" y1="310" x2="900" y2="310" stroke="#14351b" stroke-width="1"/>
  <text x="35" y="335" fill="#39ff6a" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" font-weight="700">&gt; RESULT:</text>
  <text x="105" y="335" fill="#d9ffe2" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11">
    CONCURRENT MULTI-ROUTE DISPATCH • PARALLEL RANGE DOWNLOADS • NATIVE DARWIN INTEGRATION
  </text>
</svg>