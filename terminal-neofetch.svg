<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">
  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08140a"/>
      <stop offset="100%" stop-color="#030704"/>
    </linearGradient>
    <radialGradient id="batSignal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39ff6a" stop-opacity="0.52"/>
      <stop offset="48%" stop-color="#22b84a" stop-opacity="0.22"/>
      <stop offset="82%" stop-color="#0b3617" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#030704" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="capeShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020503"/>
      <stop offset="65%" stop-color="#061209"/>
      <stop offset="100%" stop-color="#0c2613"/>
    </linearGradient>
    <clipPath id="batPanelClip">
      <rect x="6" y="40" width="282" height="374" rx="10"/>
    </clipPath>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softBatGlow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer frame -->
  <rect x="2" y="2" width="916" height="416" rx="14" fill="url(#termBg)" stroke="#39ff6a" stroke-width="1.5"/>

  <!-- Window title bar -->
  <path d="M 2 16 Q 2 2 16 2 L 904 2 Q 918 2 918 16 L 918 38 L 2 38 Z" fill="#0d2212"/>
  <line x1="2" y1="38" x2="918" y2="38" stroke="#14351b" stroke-width="1"/>

  <!-- Traffic lights -->
  <circle cx="22" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="20" r="6" fill="#27c93f"/>

  <!-- Window title text -->
  <text x="460" y="24" fill="#7dff9a" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">parth@workstation: ~ (zsh) // neofetch --specs</text>

  <!-- Left: Cinematic Gotham City + Huge Animated Bat-Signal + Batman Rooftop Pose -->
  <g clip-path="url(#batPanelClip)">
    <!-- Atmospheric horizon haze behind Gotham -->
    <linearGradient id="cityHaze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#030704" stop-opacity="0"/>
      <stop offset="60%" stop-color="#0a2611" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#020503" stop-opacity="0.9"/>
    </linearGradient>
    <rect x="6" y="180" width="282" height="220" fill="url(#cityHaze)"/>

    <!-- Wide cinematic Bat-Signal spotlight cone across the sky -->
    <polygon points="147,340 6,40 288,40" fill="#39ff6a" opacity="0.04"/>

    <!-- Giant Animated Bat-Signal Emblem -->
    <g transform="translate(147, 126)">
      <circle r="130" fill="url(#batSignal)">
        <animate attributeName="r" values="122;136;122" dur="3.8s" repeatCount="indefinite"/>
      </circle>
      <circle r="114" fill="none" stroke="#39ff6a" stroke-width="0.9" opacity="0.26" stroke-dasharray="5 12">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="32s" repeatCount="indefinite"/>
      </circle>
      <circle r="98" fill="none" stroke="#7dff9a" stroke-width="0.8" opacity="0.16" stroke-dasharray="2 14">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="22s" repeatCount="indefinite"/>
      </circle>

      <!-- Scaled-up Iconic Bat-Symbol -->
      <g transform="scale(1.32)" filter="url(#softBatGlow)">
        <path d="M 0,-18 C 3,-18 5,-19 6,-20 L 9,-34 L 13,-17 C 21,-13 31,-14 39,-24 C 55,-30 71,-29 86,-22 C 69,-11 60,4 56,19 C 47,6 35,6 28,23 C 18,9 9,14 0,34 C -9,14 -18,9 -28,23 C -35,6 -47,6 -56,19 C -60,4 -69,-11 -86,-22 C -71,-29 -55,-30 -39,-24 C -31,-14 -21,-13 -13,-17 L -9,-34 L -6,-20 C -5,-19 -3,-18 0,-18 Z"
              fill="#040d06" stroke="#39ff6a" stroke-width="1.6">
          <animate attributeName="stroke-opacity" values="0.72;1;0.72" dur="2.5s" repeatCount="indefinite"/>
        </path>
        <!-- Animated energy pulse sweeping around the Bat-Symbol edge -->
        <path d="M 0,-18 C 3,-18 5,-19 6,-20 L 9,-34 L 13,-17 C 21,-13 31,-14 39,-24 C 55,-30 71,-29 86,-22 C 69,-11 60,4 56,19 C 47,6 35,6 28,23 C 18,9 9,14 0,34 C -9,14 -18,9 -28,23 C -35,6 -47,6 -56,19 C -60,4 -69,-11 -86,-22 C -71,-29 -55,-30 -39,-24 C -31,-14 -21,-13 -13,-17 L -9,-34 L -6,-20 C -5,-19 -3,-18 0,-18 Z"
              fill="none" stroke="#b6ffca" stroke-width="1.2" stroke-dasharray="55 240" opacity="0.88">
          <animate attributeName="stroke-dashoffset" from="0" to="-295" dur="4.2s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

    <!-- Layer 1: Far Gotham Skyline Spires -->
    <path d="M 6,385 L 6,258 L 22,258 L 22,226 L 29,210 L 36,226 L 36,268 L 54,268 L 54,238 L 76,238 L 76,274 L 166,274 L 166,244 L 188,244 L 188,214 L 195,192 L 202,214 L 202,254 L 220,254 L 220,224 L 246,224 L 246,264 L 262,264 L 262,234 L 288,234 L 288,385 Z"
          fill="#040d06" stroke="#113118" stroke-width="0.7" opacity="0.75"/>
    <!-- Blinking spire beacons on Gotham towers -->
    <circle cx="29" cy="208" r="1.4" fill="#39ff6a" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.15;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="195" cy="190" r="1.5" fill="#ff5f56" filter="url(#glow)">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/>
    </circle>

    <!-- Layer 2: Midground Gotham City Towers + Subtle Lit Windows -->
    <path d="M 6,385 L 6,292 L 18,292 L 18,266 L 44,266 L 44,304 L 62,304 L 62,278 L 90,278 L 90,318 L 154,318 L 154,282 L 182,282 L 182,258 L 210,258 L 210,295 L 228,295 L 228,248 L 256,248 L 256,288 L 274,288 L 274,268 L 288,268 L 288,385 Z"
          fill="#051108" stroke="#184722" stroke-width="0.8"/>

    <!-- Minimal crisp skyscraper window lights -->
    <g fill="#39ff6a" opacity="0.26">
      <rect x="24" y="276" width="2" height="3"/><rect x="30" y="276" width="2" height="3"/><rect x="36" y="276" width="2" height="3"/>
      <rect x="24" y="286" width="2" height="3"/><rect x="36" y="286" width="2" height="3"/>
      <rect x="68" y="288" width="2" height="3"/><rect x="74" y="288" width="2" height="3"/><rect x="80" y="298" width="2" height="3"/>
      <rect x="162" y="292" width="2" height="3"/><rect x="168" y="292" width="2" height="3"/><rect x="162" y="302" width="2" height="3"/>
      <rect x="189" y="268" width="2" height="3"/><rect x="195" y="268" width="2" height="3"/><rect x="201" y="268" width="2" height="3"/>
      <rect x="189" y="278" width="2" height="3"/><rect x="201" y="278" width="2" height="3"/>
      <rect x="235" y="258" width="2" height="3"/><rect x="241" y="258" width="2" height="3"/><rect x="247" y="258" width="2" height="3"/>
      <rect x="235" y="268" width="2" height="3"/><rect x="247" y="268" width="2" height="3"/><rect x="241" y="278" width="2" height="3"/>
    </g>

    <!-- Animated Wind Streaks across the Gotham Sky -->
    <g stroke="#39ff6a" stroke-width="0.9" stroke-linecap="round" opacity="0.2">
      <line x1="20" y1="84" x2="65" y2="77">
        <animate attributeName="x1" values="-40;290" dur="2.1s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="5;335" dur="2.1s" repeatCount="indefinite"/>
      </line>
      <line x1="80" y1="204" x2="130" y2="197">
        <animate attributeName="x1" values="-60;290" dur="1.7s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="-10;340" dur="1.7s" repeatCount="indefinite"/>
      </line>
      <line x1="40" y1="312" x2="95" y2="305">
        <animate attributeName="x1" values="-50;290" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="5;345" dur="2.4s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- Smaller Foreground Batman (Back View, Cool Brooding Rooftop Stance, Cape Flowing) -->
    <!-- Legs & Boots in confident wide vigilante stance (visible beneath mid-calf flowing cape) -->
    <path d="M 101,326 L 93,374 L 103,374 L 111,340 L 119,369 L 130,369 L 123,326 Z"
          fill="#020503" stroke="#39ff6a" stroke-width="0.9" stroke-opacity="0.78"/>

    <!-- Left Armored Forearm + Gauntlet Fins + Clenched Fist angled away from cape -->
    <path d="M 97,300 L 89,322 L 89,333 L 94,334 L 99,316 Z"
          fill="#020503" stroke="#39ff6a" stroke-width="0.85" stroke-opacity="0.82"/>
    <path d="M 90,315 L 86,313 L 89,319 L 85,319 L 89,324"
          fill="none" stroke="#7dff9a" stroke-width="0.8" stroke-linejoin="round"/>

    <!-- Seamless Back Silhouette: Subtle Head Tilt + Broad Shoulders + Wide Wind-Swept Cape -->
    <path fill="url(#capeShade)" stroke="#39ff6a" stroke-width="1.05" stroke-opacity="0.92">
      <animate attributeName="d"
        values="
          M 105,292 L 104,282 L 106,268 L 109,279 C 111,277 114,277 116,279 L 119,268 L 121,282 L 119,292 C 125,293 130,296 134,302 C 160,304 190,296 218,286 C 202,312 198,330 212,350 C 190,342 172,348 158,360 C 144,348 130,350 120,358 C 110,348 100,350 92,356 C 95,332 95,308 97,298 C 100,294 103,292 105,292 Z;
          M 105,292 L 104,282 L 106,268 L 109,279 C 111,277 114,277 116,279 L 119,268 L 121,282 L 119,292 C 125,293 130,296 134,302 C 164,296 194,284 224,296 C 206,318 208,336 202,358 C 182,346 168,356 152,364 C 138,350 126,354 114,360 C 106,348 98,352 90,352 C 95,328 95,308 97,298 C 100,294 103,292 105,292 Z;
          M 105,292 L 104,282 L 106,268 L 109,279 C 111,277 114,277 116,279 L 119,268 L 121,282 L 119,292 C 125,293 130,296 134,302 C 158,306 188,302 212,282 C 200,308 204,326 216,344 C 194,338 176,344 162,356 C 146,344 132,348 122,354 C 112,346 102,348 94,358 C 95,332 95,310 97,298 C 100,294 103,292 105,292 Z;
          M 105,292 L 104,282 L 106,268 L 109,279 C 111,277 114,277 116,279 L 119,268 L 121,282 L 119,292 C 125,293 130,296 134,302 C 160,304 190,296 218,286 C 202,312 198,330 212,350 C 190,342 172,348 158,360 C 144,348 130,350 120,358 C 110,348 100,350 92,356 C 95,332 95,308 97,298 C 100,294 103,292 105,292 Z"
        dur="3.2s" repeatCount="indefinite"/>
    </path>

    <!-- Animated Cape Inner Fold Highlights -->
    <path fill="none" stroke="#39ff6a" stroke-width="0.8" opacity="0.5">
      <animate attributeName="d"
        values="
          M 116,298 C 132,318 146,334 158,360;
          M 116,298 C 136,316 144,338 152,364;
          M 116,298 C 130,320 148,332 162,356;
          M 116,298 C 132,318 146,334 158,360"
        dur="3.2s" repeatCount="indefinite"/>
    </path>
    <path fill="none" stroke="#7dff9a" stroke-width="0.65" opacity="0.4">
      <animate attributeName="d"
        values="
          M 126,298 C 150,312 180,326 212,350;
          M 126,298 C 156,310 184,332 202,358;
          M 126,298 C 148,314 182,322 216,344;
          M 126,298 C 150,312 180,326 212,350"
        dur="3.2s" repeatCount="indefinite"/>
    </path>

    <!-- Top Cowl & Shoulder Rim-Highlight from Bat-Signal -->
    <path d="M 97,298 C 100,294 103,292 105,292 L 104,282 L 106,268 L 109,279 C 111,277 114,277 116,279 L 119,268 L 121,282 L 119,292 C 125,293 130,296 134,302"
          fill="none" stroke="#b6ffca" stroke-width="1.2" opacity="0.9"/>

    <!-- Open Gotham Cliffside Rooftop Ledge (drops down on the right revealing the city below) -->
    <path d="M 6,374 L 116,374 L 116,369 L 146,369 L 172,388 L 288,388 L 288,416 L 6,416 Z"
          fill="#030804" stroke="#39ff6a" stroke-width="1.05" stroke-opacity="0.5"/>
    <text x="147" y="405" fill="#70c882" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="1.5">GOTHAM // WATCH_MODE</text>
  </g>

  <!-- Vertical separator -->
  <line x1="292" y1="52" x2="292" y2="400" stroke="#14351b" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Right: Specs Details -->
  <g transform="translate(316, 75)" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13">
    <!-- Prompt & User -->
    <text x="0" y="15" fill="#39ff6a" font-size="16" font-weight="700" filter="url(#glow)">parth@macbook-pro</text>
    <text x="0" y="32" fill="#70c882">----------------------------------------------------</text>

    <!-- Key-Value pairs -->
    <text x="0" y="58" fill="#7dff9a" font-weight="600">OS</text>
    <text x="122" y="58" fill="#d9ffe2">macOS Darwin (Apple Silicon) / Unix</text>

    <text x="0" y="82" fill="#7dff9a" font-weight="600">HOST</text>
    <text x="122" y="82" fill="#d9ffe2">Graphic Era Hill University, Class of 2028</text>

    <text x="0" y="106" fill="#7dff9a" font-weight="600">DEGREE</text>
    <text x="122" y="106" fill="#d9ffe2">B.Tech Computer Science &amp; Engineering</text>

    <text x="0" y="130" fill="#7dff9a" font-weight="600">PHILOSOPHY</text>
    <text x="122" y="130" fill="#39ff6a">&quot;Make complicated things feel simple.&quot;</text>

    <text x="0" y="154" fill="#7dff9a" font-weight="600">FLAGSHIP</text>
    <text x="122" y="154" fill="#d9ffe2">Netwich [macOS Multi-Interface Network Tool]</text>

    <text x="0" y="178" fill="#7dff9a" font-weight="600">CAMPUS APP</text>
    <text x="122" y="178" fill="#d9ffe2">GEHU Connect [Campus Mobile Platform / Testing]</text>

    <text x="0" y="202" fill="#7dff9a" font-weight="600">SPATIAL &amp; GIS</text>
    <text x="122" y="202" fill="#d9ffe2">Project Aranya [Wildlife Conflict Intelligence]</text>

    <text x="0" y="226" fill="#7dff9a" font-weight="600">SIMULATION</text>
    <text x="122" y="226" fill="#d9ffe2">MeghaVyuha (Error Atlas) + ORVESS-PAT (FSOC)</text>

    <text x="0" y="250" fill="#7dff9a" font-weight="600">LEADERSHIP</text>
    <text x="122" y="250" fill="#d9ffe2">Director General, University Model UN Club</text>

    <text x="0" y="274" fill="#7dff9a" font-weight="600">UPTIME</text>
    <text x="122" y="274" fill="#39ff6a">3 Years Active Engineering // Continuously Building</text>

    <!-- Color blocks / palette -->
    <g transform="translate(0, 295)">
      <rect x="0" y="0" width="32" height="14" fill="#061008" stroke="#14351b" rx="2"/>
      <rect x="38" y="0" width="32" height="14" fill="#14351b" rx="2"/>
      <rect x="76" y="0" width="32" height="14" fill="#285832" rx="2"/>
      <rect x="114" y="0" width="32" height="14" fill="#4d9b5c" rx="2"/>
      <rect x="152" y="0" width="32" height="14" fill="#70c882" rx="2"/>
      <rect x="190" y="0" width="32" height="14" fill="#7dff9a" rx="2"/>
      <rect x="228" y="0" width="32" height="14" fill="#39ff6a" rx="2"/>
      <rect x="266" y="0" width="32" height="14" fill="#d9ffe2" rx="2"/>
    </g>
  </g>
</svg>