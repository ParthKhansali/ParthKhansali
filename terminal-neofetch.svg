<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">
  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08140a"/>
      <stop offset="100%" stop-color="#030704"/>
    </linearGradient>
    <radialGradient id="batSignal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39ff6a" stop-opacity="0.52"/>
      <stop offset="48%" stop-color="#22b84a" stop-opacity="0.22"/>
      <stop offset="82%" stop-color="#0b3617" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#030704" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="capeShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020503"/>
      <stop offset="65%" stop-color="#061209"/>
      <stop offset="100%" stop-color="#0c2613"/>
    </linearGradient>
    <clipPath id="batPanelClip">
      <rect x="6" y="40" width="282" height="374" rx="10"/>
    </clipPath>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softBatGlow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer frame -->
  <rect x="2" y="2" width="916" height="416" rx="14" fill="url(#termBg)" stroke="#39ff6a" stroke-width="1.5"/>

  <!-- Window title bar -->
  <path d="M 2 16 Q 2 2 16 2 L 904 2 Q 918 2 918 16 L 918 38 L 2 38 Z" fill="#0d2212"/>
  <line x1="2" y1="38" x2="918" y2="38" stroke="#14351b" stroke-width="1"/>

  <!-- Traffic lights -->
  <circle cx="22" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="20" r="6" fill="#27c93f"/>

  <!-- Window title text -->
  <text x="460" y="24" fill="#7dff9a" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">parth@workstation: ~ (zsh) // neofetch --specs</text>

  <!-- Left: Animated Gotham Bat-Signal + Batman Standing (Back View, Cape Flowing) -->
  <g clip-path="url(#batPanelClip)">
    <!-- Subtle spotlight beam rising from rooftop edge into night sky -->
    <polygon points="147,392 18,46 276,46" fill="#39ff6a" opacity="0.045"/>

    <!-- Animated Bat-Signal Halo & Tactical Rings -->
    <g transform="translate(147, 134)">
      <circle r="102" fill="url(#batSignal)">
        <animate attributeName="r" values="96;108;96" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <circle r="86" fill="none" stroke="#39ff6a" stroke-width="1.1" opacity="0.34" stroke-dasharray="6 10">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
      </circle>
      <circle r="72" fill="none" stroke="#7dff9a" stroke-width="0.9" opacity="0.22" stroke-dasharray="3 12">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="20s" repeatCount="indefinite"/>
      </circle>

      <!-- Glowing Bat-Symbol Emblem -->
      <g filter="url(#softBatGlow)">
        <path d="M 0,-18 C 3,-18 5,-19 6,-20 L 9,-34 L 13,-17 C 21,-13 31,-14 39,-24 C 55,-30 71,-29 86,-22 C 69,-11 60,4 56,19 C 47,6 35,6 28,23 C 18,9 9,14 0,34 C -9,14 -18,9 -28,23 C -35,6 -47,6 -56,19 C -60,4 -69,-11 -86,-22 C -71,-29 -55,-30 -39,-24 C -31,-14 -21,-13 -13,-17 L -9,-34 L -6,-20 C -5,-19 -3,-18 0,-18 Z"
              fill="#040d06" stroke="#39ff6a" stroke-width="1.8">
          <animate attributeName="stroke-opacity" values="0.75;1;0.75" dur="2.4s" repeatCount="indefinite"/>
        </path>
        <!-- Pulsing neon energy trace around Bat-Symbol -->
        <path d="M 0,-18 C 3,-18 5,-19 6,-20 L 9,-34 L 13,-17 C 21,-13 31,-14 39,-24 C 55,-30 71,-29 86,-22 C 69,-11 60,4 56,19 C 47,6 35,6 28,23 C 18,9 9,14 0,34 C -9,14 -18,9 -28,23 C -35,6 -47,6 -56,19 C -60,4 -69,-11 -86,-22 C -71,-29 -55,-30 -39,-24 C -31,-14 -21,-13 -13,-17 L -9,-34 L -6,-20 C -5,-19 -3,-18 0,-18 Z"
              fill="none" stroke="#b6ffca" stroke-width="1.4" stroke-dasharray="55 240" opacity="0.85">
          <animate attributeName="stroke-dashoffset" from="0" to="-295" dur="4s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

    <!-- Distant Gotham Skyline Silhouette -->
    <path d="M 6,386 L 6,320 L 22,320 L 22,296 L 42,296 L 42,334 L 60,334 L 60,282 L 78,282 L 78,318 L 210,318 L 210,276 L 232,276 L 232,310 L 254,310 L 254,288 L 272,288 L 272,330 L 288,330 L 288,386 Z"
          fill="#061309" stroke="#14351b" stroke-width="0.8" opacity="0.7"/>

    <!-- Animated Wind / Rain Streaks -->
    <g stroke="#39ff6a" stroke-width="1" stroke-linecap="round" opacity="0.22">
      <line x1="20" y1="88" x2="65" y2="80">
        <animate attributeName="x1" values="-40;290" dur="2.1s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="5;335" dur="2.1s" repeatCount="indefinite"/>
      </line>
      <line x1="80" y1="200" x2="130" y2="192">
        <animate attributeName="x1" values="-60;290" dur="1.7s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="-10;340" dur="1.7s" repeatCount="indefinite"/>
      </line>
      <line x1="40" y1="275" x2="95" y2="266">
        <animate attributeName="x1" values="-50;290" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="5;345" dur="2.5s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- Taut Grapnel Line from Batman's raised right gauntlet into the Gotham night -->
    <line x1="186" y1="196" x2="274" y2="56" stroke="#7dff9a" stroke-width="1.2" opacity="0.75">
      <animate attributeName="opacity" values="0.45;0.9;0.45" dur="2.6s" repeatCount="indefinite"/>
    </line>

    <!-- Lower Legs / Boots planted heroically on the rooftop parapet -->
    <path d="M 110,295 L 103,374 L 119,374 L 127,320 L 136,368 L 152,368 L 146,295 Z"
          fill="#020503" stroke="#39ff6a" stroke-width="0.9" stroke-opacity="0.65"/>

    <!-- Left Gauntlet + Fist & Raised Right Armored Grapnel Arm (with 3 gauntlet fins) -->
    <path d="M 103,234 L 91,274 L 88,281 L 92,290 L 98,287 L 106,256 Z"
          fill="#020503" stroke="#39ff6a" stroke-width="0.9" stroke-opacity="0.75"/>
    <path d="M 150,224 L 172,212 L 182,199 L 184,193 L 190,196 L 186,204 L 178,220 L 154,238 Z"
          fill="#020503" stroke="#7dff9a" stroke-width="1" stroke-opacity="0.9"/>
    <!-- Gauntlet fins on raised forearm -->
    <path d="M 171,213 L 168,207 L 174,210 L 173,204 L 178,207"
          fill="none" stroke="#7dff9a" stroke-width="1" stroke-linejoin="round"/>

    <!-- Seamless Back Silhouette: Cowl + Shoulders + Animated Flowing Cape -->
    <path fill="url(#capeShade)" stroke="#39ff6a" stroke-width="1.15" stroke-opacity="0.9">
      <animate attributeName="d"
        values="
          M 119,212 L 117,198 L 119,179 L 124,195 C 128,193 132,193 136,195 L 141,179 L 143,198 L 141,212 C 149,215 156,220 162,228 C 194,234 232,226 266,214 C 248,252 244,284 260,320 C 230,312 208,326 192,350 C 174,334 154,342 142,366 C 126,348 112,354 96,370 C 96,318 98,266 105,226 C 110,218 115,214 119,212 Z;
          M 119,212 L 117,198 L 119,179 L 124,195 C 128,193 132,193 136,195 L 141,179 L 143,198 L 141,212 C 149,215 156,220 162,228 C 198,224 236,212 272,228 C 252,262 256,294 248,334 C 220,320 202,340 182,358 C 166,340 150,348 134,372 C 120,352 108,358 92,364 C 96,312 98,266 105,226 C 110,218 115,214 119,212 Z;
          M 119,212 L 117,198 L 119,179 L 124,195 C 128,193 132,193 136,195 L 141,179 L 143,198 L 141,212 C 149,215 156,220 162,228 C 190,238 228,236 258,208 C 246,246 250,278 266,310 C 236,306 212,320 198,344 C 178,328 158,336 146,360 C 128,344 114,352 98,374 C 98,320 98,268 105,226 C 110,218 115,214 119,212 Z;
          M 119,212 L 117,198 L 119,179 L 124,195 C 128,193 132,193 136,195 L 141,179 L 143,198 L 141,212 C 149,215 156,220 162,228 C 194,234 232,226 266,214 C 248,252 244,284 260,320 C 230,312 208,326 192,350 C 174,334 154,342 142,366 C 126,348 112,354 96,370 C 96,318 98,266 105,226 C 110,218 115,214 119,212 Z"
        dur="3.2s" repeatCount="indefinite"/>
    </path>

    <!-- Animated Cape Inner Fold Highlights -->
    <path fill="none" stroke="#39ff6a" stroke-width="0.9" opacity="0.45">
      <animate attributeName="d"
        values="
          M 134,224 C 154,258 176,290 192,350;
          M 134,224 C 160,256 172,298 182,358;
          M 134,224 C 150,262 180,286 198,344;
          M 134,224 C 154,258 176,290 192,350"
        dur="3.2s" repeatCount="indefinite"/>
    </path>
    <path fill="none" stroke="#7dff9a" stroke-width="0.7" opacity="0.38">
      <animate attributeName="d"
        values="
          M 150,224 C 180,248 216,274 260,320;
          M 150,224 C 186,244 220,284 248,334;
          M 150,224 C 178,252 220,268 266,310;
          M 150,224 C 180,248 216,274 260,320"
        dur="3.2s" repeatCount="indefinite"/>
    </path>

    <!-- Top Cowl & Shoulder Rim-Highlight Only (facing Bat-Signal spotlight) -->
    <path d="M 105,226 C 110,218 115,214 119,212 L 117,198 L 119,179 L 124,195 C 128,193 132,193 136,195 L 141,179 L 143,198 L 141,212 C 149,215 156,220 162,228"
          fill="none" stroke="#b6ffca" stroke-width="1.3" opacity="0.85"/>

    <!-- Rooftop Parapet / Gargoyle Ledge -->
    <path d="M 6,374 L 130,374 L 130,368 L 166,368 L 166,378 L 288,378 L 288,416 L 6,416 Z"
          fill="#040b05" stroke="#39ff6a" stroke-width="1.1" stroke-opacity="0.5"/>
    <text x="147" y="401" fill="#70c882" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="1.5">GOTHAM // WATCH_MODE</text>
  </g>

  <!-- Vertical separator -->
  <line x1="292" y1="52" x2="292" y2="400" stroke="#14351b" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Right: Specs Details -->
  <g transform="translate(316, 75)" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13">
    <!-- Prompt & User -->
    <text x="0" y="15" fill="#39ff6a" font-size="16" font-weight="700" filter="url(#glow)">parth@macbook-pro</text>
    <text x="0" y="32" fill="#70c882">----------------------------------------------------</text>

    <!-- Key-Value pairs -->
    <text x="0" y="58" fill="#7dff9a" font-weight="600">OS</text>
    <text x="122" y="58" fill="#d9ffe2">macOS Darwin (Apple Silicon) / Unix</text>

    <text x="0" y="82" fill="#7dff9a" font-weight="600">HOST</text>
    <text x="122" y="82" fill="#d9ffe2">Graphic Era Hill University, Class of 2028</text>

    <text x="0" y="106" fill="#7dff9a" font-weight="600">DEGREE</text>
    <text x="122" y="106" fill="#d9ffe2">B.Tech Computer Science &amp; Engineering</text>

    <text x="0" y="130" fill="#7dff9a" font-weight="600">PHILOSOPHY</text>
    <text x="122" y="130" fill="#39ff6a">&quot;Make complicated things feel simple.&quot;</text>

    <text x="0" y="154" fill="#7dff9a" font-weight="600">FLAGSHIP</text>
    <text x="122" y="154" fill="#d9ffe2">Netwich [macOS Multi-Interface Network Tool]</text>

    <text x="0" y="178" fill="#7dff9a" font-weight="600">CAMPUS APP</text>
    <text x="122" y="178" fill="#d9ffe2">GEHU Connect [Campus Mobile Platform / Testing]</text>

    <text x="0" y="202" fill="#7dff9a" font-weight="600">SPATIAL &amp; GIS</text>
    <text x="122" y="202" fill="#d9ffe2">Project Aranya [Wildlife Conflict Intelligence]</text>

    <text x="0" y="226" fill="#7dff9a" font-weight="600">SIMULATION</text>
    <text x="122" y="226" fill="#d9ffe2">MeghaVyuha (Error Atlas) + ORVESS-PAT (FSOC)</text>

    <text x="0" y="250" fill="#7dff9a" font-weight="600">LEADERSHIP</text>
    <text x="122" y="250" fill="#d9ffe2">Director General, University Model UN Club</text>

    <text x="0" y="274" fill="#7dff9a" font-weight="600">UPTIME</text>
    <text x="122" y="274" fill="#39ff6a">3 Years Active Engineering // Continuously Building</text>

    <!-- Color blocks / palette -->
    <g transform="translate(0, 295)">
      <rect x="0" y="0" width="32" height="14" fill="#061008" stroke="#14351b" rx="2"/>
      <rect x="38" y="0" width="32" height="14" fill="#14351b" rx="2"/>
      <rect x="76" y="0" width="32" height="14" fill="#285832" rx="2"/>
      <rect x="114" y="0" width="32" height="14" fill="#4d9b5c" rx="2"/>
      <rect x="152" y="0" width="32" height="14" fill="#70c882" rx="2"/>
      <rect x="190" y="0" width="32" height="14" fill="#7dff9a" rx="2"/>
      <rect x="228" y="0" width="32" height="14" fill="#39ff6a" rx="2"/>
      <rect x="266" y="0" width="32" height="14" fill="#d9ffe2" rx="2"/>
    </g>
  </g>
</svg>