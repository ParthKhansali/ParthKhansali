<svg xmlns="http://www.w3.org/2000/svg" width="900" height="30" viewBox="0 0 900 30">
  <defs>
    <linearGradient id="lineGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39ff6a" stop-opacity="0"/>
      <stop offset="20%" stop-color="#39ff6a" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#39ff6a" stop-opacity="1"/>
      <stop offset="80%" stop-color="#39ff6a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#39ff6a" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Horizontal glowing line -->
  <line x1="50" y1="15" x2="850" y2="15" stroke="url(#lineGlow)" stroke-width="1.5" filter="url(#glow)"/>
  
  <!-- Left wing accent -->
  <path d="M 180 9 L 195 15 L 180 21" fill="none" stroke="#39ff6a" stroke-width="1.5" opacity="0.7"/>
  <path d="M 190 9 L 205 15 L 190 21" fill="none" stroke="#39ff6a" stroke-width="1.5" opacity="0.4"/>

  <!-- Center badge -->
  <rect x="390" y="5" width="120" height="20" rx="4" fill="#061008" stroke="#39ff6a" stroke-width="1"/>
  <text x="450" y="19" fill="#7dff9a" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" font-weight="700" letter-spacing="2" text-anchor="middle">SYS.TELEMETRY</text>

  <!-- Right wing accent -->
  <path d="M 720 9 L 705 15 L 720 21" fill="none" stroke="#39ff6a" stroke-width="1.5" opacity="0.7"/>
  <path d="M 710 9 L 695 15 L 710 21" fill="none" stroke="#39ff6a" stroke-width="1.5" opacity="0.4"/>
</svg>