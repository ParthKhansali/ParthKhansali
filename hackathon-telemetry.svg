<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08140a"/>
      <stop offset="100%" stop-color="#020603"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Frame -->
  <rect x="2" y="2" width="916" height="296" rx="14" fill="url(#cardBg)" stroke="#39ff6a" stroke-width="1.5"/>

  <!-- Top bar -->
  <path d="M 2 16 Q 2 2 16 2 L 904 2 Q 918 2 918 16 L 918 38 L 2 38 Z" fill="#0d2212"/>
  <line x1="2" y1="38" x2="918" y2="38" stroke="#14351b" stroke-width="1"/>
  <circle cx="24" cy="20" r="5" fill="#39ff6a" filter="url(#glow)">
    <animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="42" y="25" fill="#7dff9a" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="700">ACTIVE HACKATHON MISSIONS // RESEARCH &amp; SCIENTIFIC COMPUTATION</text>
  <text x="895" y="25" fill="#39ff6a" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" text-anchor="end">[ STATUS: 3 ONGOING ]</text>

  <!-- Panel 1: Aranya -->
  <g transform="translate(25, 55)" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <rect width="270" height="225" rx="10" fill="#061109" stroke="#39ff6a" stroke-width="1.2"/>
    <rect width="270" height="26" rx="10" fill="#14351b"/>
    <text x="135" y="18" fill="#d9ffe2" font-size="11" font-weight="700" text-anchor="middle">PROJECT ARANYA</text>

    <!-- Radar / GIS Scope graphic -->
    <g transform="translate(135, 75)">
      <circle r="32" fill="none" stroke="#39ff6a" stroke-width="1" opacity="0.5"/>
      <circle r="18" fill="none" stroke="#39ff6a" stroke-width="1" opacity="0.3"/>
      <line x1="-36" y1="0" x2="36" y2="0" stroke="#39ff6a" stroke-width="0.8" opacity="0.4"/>
      <line x1="0" y1="-36" x2="0" y2="36" stroke="#39ff6a" stroke-width="0.8" opacity="0.4"/>
      <circle cx="10" cy="-12" r="3" fill="#39ff6a" filter="url(#glow)">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-14" cy="8" r="2.5" fill="#7dff9a"/>
    </g>

    <text x="135" y="128" fill="#39ff6a" font-size="12" font-weight="700" text-anchor="middle">Geospatial Wildlife Intel</text>
    <text x="135" y="148" fill="#d9ffe2" font-size="10" text-anchor="middle">Conflict prediction &amp; movement GIS</text>
    <text x="135" y="166" fill="#70c882" font-size="10" text-anchor="middle">Pilot: Uttarakhand Forest Ranges</text>

    <rect x="15" y="182" width="240" height="28" rx="6" fill="#08180c" stroke="#14351b"/>
    <text x="135" y="200" fill="#7dff9a" font-size="10" text-anchor="middle">CESIUMJS · VECTOR TILES · VITE</text>
  </g>

  <!-- Panel 2: MeghaVyuha -->
  <g transform="translate(325, 55)" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <rect width="270" height="225" rx="10" fill="#061109" stroke="#39ff6a" stroke-width="1.2"/>
    <rect width="270" height="26" rx="10" fill="#14351b"/>
    <text x="135" y="18" fill="#d9ffe2" font-size="11" font-weight="700" text-anchor="middle">MEGHAVYUHA</text>

    <!-- Weather error curve graphic -->
    <g transform="translate(55, 60)">
      <rect width="160" height="45" fill="#040a05" stroke="#14351b" rx="4"/>
      <path d="M 10 35 Q 40 8 80 26 T 150 15" fill="none" stroke="#39ff6a" stroke-width="1.8" filter="url(#glow)"/>
      <path d="M 10 25 Q 50 35 90 12 T 150 30" fill="none" stroke="#70c882" stroke-width="1.2" stroke-dasharray="3 3"/>
      <!-- Error delta lines -->
      <line x1="80" y1="26" x2="80" y2="16" stroke="#ff5f56" stroke-width="1.5"/>
    </g>

    <text x="135" y="128" fill="#39ff6a" font-size="12" font-weight="700" text-anchor="middle">Weather Error Atlas</text>
    <text x="135" y="148" fill="#d9ffe2" font-size="10" text-anchor="middle">Forecast error pattern discovery</text>
    <text x="135" y="166" fill="#70c882" font-size="10" text-anchor="middle">Sensor divergence analytics</text>

    <rect x="15" y="182" width="240" height="28" rx="6" fill="#08180c" stroke="#14351b"/>
    <text x="135" y="200" fill="#7dff9a" font-size="10" text-anchor="middle">TYPESCRIPT · PYTHON · DATA VIZ</text>
  </g>

  <!-- Panel 3: ORVESS-PAT -->
  <g transform="translate(625, 55)" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <rect width="270" height="225" rx="10" fill="#061109" stroke="#39ff6a" stroke-width="1.2"/>
    <rect width="270" height="26" rx="10" fill="#14351b"/>
    <text x="135" y="18" fill="#d9ffe2" font-size="11" font-weight="700" text-anchor="middle">ORVESS-PAT</text>

    <!-- Optical beam tracking graphic -->
    <g transform="translate(135, 75)">
      <rect x="-30" y="-20" width="60" height="40" fill="none" stroke="#39ff6a" stroke-width="1" opacity="0.5"/>
      <circle r="12" fill="none" stroke="#39ff6a" stroke-width="1"/>
      <line x1="-36" y1="0" x2="36" y2="0" stroke="#39ff6a" stroke-width="1" stroke-dasharray="2 2"/>
      <line x1="0" y1="-26" x2="0" y2="26" stroke="#39ff6a" stroke-width="1" stroke-dasharray="2 2"/>
      <circle cx="3" cy="-2" r="3" fill="#ff5f56" filter="url(#glow)">
        <animate attributeName="r" values="2;4;2" dur="1s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="135" y="128" fill="#39ff6a" font-size="12" font-weight="700" text-anchor="middle">FSOC Optical Tracking</text>
    <text x="135" y="148" fill="#d9ffe2" font-size="10" text-anchor="middle">Coarse pointing &amp; target simulation</text>
    <text x="135" y="166" fill="#70c882" font-size="10" text-anchor="middle">SIH26169 · Ongoing Optical Simulation</text>

    <rect x="15" y="182" width="240" height="28" rx="6" fill="#08180c" stroke="#14351b"/>
    <text x="135" y="200" fill="#7dff9a" font-size="10" text-anchor="middle">PYTHON · PYSIDE6 · NUMPY · SCIPY</text>
  </g>
</svg>